<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="metaTheme" content="#2eb87e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Platform Belajar & Simulasi Mandiri SKD CAT (TWK, TIU, TKP). Aplikasi edukasi independen untuk latihan soal mandiri.">
  <title>Simulasi Mandiri SKD CAT — Portal Belajar</title>
  <script>
    /* Terapkan tema tersimpan sebelum render agar tidak berkedip */
    try {
      var t = localStorage.getItem('cpns_theme');
      if (t) {
        document.documentElement.setAttribute('data-theme', t);
        var mt = document.getElementById('metaTheme');
        if (mt) mt.setAttribute('content', t === 'dark' ? '#162821' : '#2eb87e');
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json?v=5">
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/twobznku/image/upload/f_auto/q_auto/Menjaga_Tradisi_Menghasilkan_Kualitas_1_hurgyx.png">
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/twobznku/image/upload/f_auto/q_auto/Menjaga_Tradisi_Menghasilkan_Kualitas_1_hurgyx.png">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div id="app">
    <div class="splash"><img src="https://res.cloudinary.com/twobznku/image/upload/f_auto/q_auto/Menjaga_Tradisi_Menghasilkan_Kualitas_1_hurgyx.png" alt="Logo Latihan CPNS" style="width:80px;height:80px;border-radius:18px;object-fit:contain;box-shadow:0 8px 24px rgba(46,184,126,.25)"><div class="spin"></div><p>Memuat aplikasi…</p></div>
  </div>
  <div id="modalRoot"></div>
  <div id="loader" class="loader" hidden><div class="spin"></div><p id="loaderTxt">Memuat…</p></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/config.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
