<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="metaTheme" content="#6b5bc4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Aplikasi Latihan CPNS</title>
  <script>
    /* Terapkan tema tersimpan sebelum render agar tidak berkedip */
    try {
      var t = localStorage.getItem('cpns_theme');
      if (t) {
        document.documentElement.setAttribute('data-theme', t);
        var mt = document.getElementById('metaTheme');
        if (mt) mt.setAttribute('content', t === 'dark' ? '#211d3d' : '#6b5bc4');
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="splash"><div class="spin"></div><p>Memuat aplikasi…</p></div>
  </div>
  <div id="modalRoot"></div>
  <div id="loader" class="loader" hidden><div class="spin"></div><p id="loaderTxt">Memuat…</p></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
